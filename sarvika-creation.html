<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarvika Creation</title>
<meta name="theme-color" content="#A80000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cherry+Swash:wght@700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#A80000;--deep:#6b0000;--ivory:#fffcf6;--sand:#f6ebe0;--ink:#2a0d0d;
--display:'Cherry Swash',Georgia,serif;--body:'Jost','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--body);background:var(--ivory);color:var(--ink);line-height:1.5;overflow-x:hidden;
display:flex;justify-content:center;padding:32px 18px 44px}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* background: slow rotating rings + drifting threads */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(168,0,0,.13)}
.ring.r1{width:620px;height:620px;top:-220px;right:-220px;border-style:dashed;animation:spin 60s linear infinite}
.ring.r2{width:420px;height:420px;bottom:-160px;left:-150px;animation:spin 46s linear infinite reverse}
.ring.r3{width:240px;height:240px;bottom:12%;right:-90px;border-style:dashed;animation:spin 34s linear infinite}
.thread{position:absolute;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(168,0,0,.25),transparent);animation:drift 9s ease-in-out infinite}
.thread:nth-of-type(4){top:22%}.thread:nth-of-type(5){top:58%;animation-delay:-3s}.thread:nth-of-type(6){top:84%;animation-delay:-6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{50%{transform:translateX(12%);opacity:.4}}

main{position:relative;z-index:1;width:min(480px,100%);text-align:center}

/* logo */
.logo{position:relative;width:min(300px,78%);margin:6px auto 30px;opacity:0;animation:logoIn 1.2s .2s cubic-bezier(.2,.8,.2,1) forwards}
.logo img{width:100%;display:block;-webkit-mask:linear-gradient(110deg,#000 40%,rgba(0,0,0,.55) 50%,#000 60%) 100% 0/250% 100%;mask:linear-gradient(110deg,#000 40%,rgba(0,0,0,.55) 50%,#000 60%) 100% 0/250% 100%;animation:shine 4.5s 1.6s ease-in-out infinite}
.logo::after{content:"";position:absolute;inset:-10px;border-radius:12px;background:radial-gradient(circle,rgba(168,0,0,.12),transparent 70%);z-index:-1;animation:glow 3.5s ease-in-out infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.7) translateY(20px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes shine{0%{-webkit-mask-position:100% 0;mask-position:100% 0}60%,100%{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes glow{50%{transform:scale(1.08);opacity:.6}}

/* details */
.card{background:#fff;border:1.5px solid var(--red);position:relative;padding:8px 22px;box-shadow:0 18px 44px rgba(107,0,0,.12);
clip-path:inset(0 100% 0 0);animation:wipe 1s .9s cubic-bezier(.7,0,.2,1) forwards}
.card::before{content:"";position:absolute;inset:6px;border:1px dashed rgba(168,0,0,.3);pointer-events:none}
@keyframes wipe{to{clip-path:inset(-20px -20px -20px -20px)}}
.row{padding:16px 6px;text-align:left;border-bottom:1px dashed rgba(168,0,0,.25);opacity:0;transform:translateY(16px);animation:up .7s forwards}
.row:last-child{border:0}
.row:nth-child(1){animation-delay:1.5s}.row:nth-child(2){animation-delay:1.7s}.row:nth-child(3){animation-delay:1.9s}.row:nth-child(4){animation-delay:2.1s}
.row small{display:block;font-size:.8rem;color:var(--red);font-weight:600;letter-spacing:.04em}
.row strong{display:block;font-size:1.15rem;font-weight:500;margin-top:2px}
.row.firm strong{font-family:var(--display);font-size:1.6rem;color:var(--red);line-height:1.2}
.row.gst strong{font-variant-numeric:tabular-nums;letter-spacing:.06em}
@keyframes up{to{opacity:1;transform:none}}

/* call buttons */
.call{margin-top:26px;display:grid;gap:14px}
.call h2{font-family:var(--display);font-size:1.3rem;color:var(--red);opacity:0;animation:up .7s 2.3s forwards}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;text-align:left;background:var(--red);color:#fff;text-decoration:none;padding:14px 20px;border-radius:14px;
box-shadow:0 10px 26px rgba(168,0,0,.32);opacity:0;transform:translateY(20px);animation:up .7s forwards,pulse 2.6s 3.4s infinite;transition:transform .25s,background .25s}
.btn:nth-of-type(1){animation-delay:2.5s,3.4s}
.btn:nth-of-type(2){animation-delay:2.7s,3.9s}
.btn:hover{background:var(--deep);transform:translateY(-3px)}
.btn:active{transform:scale(.97)}
.ic{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:ring 2.6s 3.4s infinite}
.ic svg{width:22px;height:22px;fill:var(--red)}
.btn span{display:block;font-size:.85rem;opacity:.85}
.btn b{display:block;font-size:1.3rem;font-weight:600;letter-spacing:.04em}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
@keyframes pulse{0%{box-shadow:0 10px 26px rgba(168,0,0,.32),0 0 0 0 rgba(168,0,0,.4)}70%,100%{box-shadow:0 10px 26px rgba(168,0,0,.32),0 0 0 16px rgba(168,0,0,0)}}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
